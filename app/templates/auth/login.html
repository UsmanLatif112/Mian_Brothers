{% extends "base.html" %}

{% block title %}Login — {{ brand_name or 'OctaneFlow' }}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="card card-premium auth-card animate-fade-in">
        <div class="card-body card-body-premium p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-logo">
                    <img src="{{ brand_logo_url or url_for('static', filename='img/logo.png') }}" alt="{{ brand_name or 'OctaneFlow' }}" width="64" height="64">
                </div>
                <h1 class="auth-title">Welcome to {{ brand_name or 'OctaneFlow' }}</h1>
                <p class="text-muted-custom mb-0">Fuel Station Management Control</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label form-label-custom">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control form-control-custom" id="username" name="username" placeholder="Enter your username" required autocomplete="username" autofocus>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label form-label-custom">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn btn-outline-secondary password-toggle" data-target="password" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label text-muted-custom" for="remember">Remember this device</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Access Dashboard
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.querySelectorAll('.password-toggle').forEach((btn) => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.getAttribute('data-target'));
            if (!input) return;
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    });
</script>
{% endblock %}
