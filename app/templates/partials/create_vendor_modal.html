{# Register Vendor — reusable (vendors page + inventory quick-add) #}
<div class="modal fade of-quick-create-modal" id="createVendorModal" tabindex="-1" aria-hidden="true" data-bs-focus="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="background-color: var(--card-bg); color: var(--text-primary); border-radius: 14px;">
            <form action="{{ url_for('vendors.index') }}" method="POST"
                  data-of-ajax-create="vendor"
                  data-create-url="{{ url_for('vendors.api_create') }}"
                  data-no-loader="1">
                <input type="hidden" name="action" value="create">
                <div class="modal-header border-0 pb-2">
                    <h5 class="modal-title fw-bold">Register Vendor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-2">
                    <div class="mb-3">
                        <label for="qv_create_name" class="form-label form-label-custom">Vendor Name</label>
                        <input type="text" class="form-control form-control-custom" id="qv_create_name" name="name" required placeholder="e.g. PSO Depot / Shell Supplier">
                    </div>
                    <div class="mb-3">
                        <label for="qv_create_contact" class="form-label form-label-custom">Contact Person</label>
                        <input type="text" class="form-control form-control-custom" id="qv_create_contact" name="contact_person" placeholder="Optional">
                    </div>
                    <div class="mb-3">
                        <label for="qv_create_phone" class="form-label form-label-custom">Phone</label>
                        <input type="text" class="form-control form-control-custom" id="qv_create_phone" name="phone" placeholder="Optional">
                    </div>
                    <div class="mb-3">
                        <label for="qv_create_address" class="form-label form-label-custom">Address</label>
                        <input type="text" class="form-control form-control-custom" id="qv_create_address" name="address" placeholder="Optional">
                    </div>
                    <div class="mb-3">
                        <label for="qv_create_previous_payable" class="form-label form-label-custom">Opening Payable <span class="text-muted-custom fw-normal">(Optional)</span></label>
                        <div class="input-group">
                            <span class="input-group-text">PKR</span>
                            <input type="number" step="0.01" min="0" class="form-control form-control-custom" id="qv_create_previous_payable" name="previous_payable" placeholder="Amount already owed">
                        </div>
                    </div>
                    <div class="mb-1">
                        <label for="qv_create_entry_date" class="form-label form-label-custom">Entry Date</label>
                        <input type="date" class="form-control form-control-custom" id="qv_create_entry_date" name="entry_date" value="{{ today }}">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-2 pb-3 gap-2">
                    <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom px-4">Register Vendor</button>
                </div>
            </form>
        </div>
    </div>
</div>
