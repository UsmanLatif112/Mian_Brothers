<div class="modal fade" id="ledgerModal" tabindex="-1" aria-labelledby="ledgerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form action="{% if customer is defined %}{{ url_for('customers.ledger', customer_id=customer.id) }}{% else %}#{% endif %}" method="POST" id="ledgerModalForm">
                <input type="hidden" name="action" id="ledger_action" value="payment">
                <input type="hidden" name="entry_kind" id="ledger_entry_kind" value="advance">
                <input type="hidden" name="amount_paid" id="ledger_amount_paid" value="">
                <input type="hidden" name="amount" id="ledger_amount" value="">
                <input type="hidden" name="return_to" id="ledger_return_to" value="">

                <div class="modal-header border-0 pb-0">
                    <div>
                        <h5 class="modal-title fw-bold" id="ledgerModalLabel">Record Payment</h5>
                        <p class="mb-0 small text-muted-custom {% if customer is not defined %}d-none{% endif %}" id="ledger_customer_label">{% if customer is defined %}{{ customer.name }}{% endif %}</p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body pt-3">
                    <div class="mb-3">
                        <label for="ledger_type" class="form-label form-label-custom">Type</label>
                        <select class="form-select form-control-custom" id="ledger_type" required>
                            <option value="payment" selected>Payment / Credit Clear</option>
                            <option value="advance">Advance (customer prepaid)</option>
                            <option value="loan">Loan (cash given to customer)</option>
                            <option value="salary">Salary (employee)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="ledger_amount_input" class="form-label form-label-custom">Amount (PKR)</label>
                        <div class="input-group">
                            <span class="input-group-text">PKR</span>
                            <input type="number" step="0.01" min="0.01" class="form-control form-control-custom" id="ledger_amount_input" placeholder="Enter amount" required>
                        </div>
                    </div>

                    <div class="mb-3 p-3 rounded d-none" id="ledger_balance_preview" data-balance="{% if customer is defined %}{{ '%.2f'|format(customer.current_balance_due or 0) }}{% else %}0.00{% endif %}" style="background: rgba(2,132,199,0.07);">
                        <div class="d-flex justify-content-between small mb-1">
                            <span class="text-muted-custom">Existing balance</span>
                            <strong id="ledger_existing_label"></strong>
                        </div>
                        <div class="d-flex justify-content-between small">
                            <span class="text-muted-custom">Remaining after this amount</span>
                            <strong id="ledger_remaining_label"></strong>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="ledger_entry_date" class="form-label form-label-custom">Date</label>
                        <input type="date" class="form-control form-control-custom" id="ledger_entry_date" name="entry_date" value="{{ today }}">
                    </div>

                    <div class="mb-3 ledger-method-wrap">
                        <label for="ledger_method" class="form-label form-label-custom">Payment Method</label>
                        <select class="form-select form-control-custom" id="ledger_method" name="method">
                            <option value="Cash" selected>Cash Payment</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Cheque">Bank Cheque</option>
                            <option value="Mobile Wallet">UPI / Mobile Pay</option>
                        </select>
                    </div>

                    <div class="mb-1">
                        <label for="ledger_note" class="form-label form-label-custom">Note / Remarks</label>
                        <input type="text" class="form-control form-control-custom" id="ledger_note" name="note" placeholder="Check number, trans ref...">
                    </div>
                </div>

                <div class="modal-footer border-0 pt-0 pb-3 gap-2">
                    <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom px-4" id="ledger_submit_btn">
                        <i class="bi bi-check-circle me-1"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function () {
    const modalEl = document.getElementById('ledgerModal');
    if (!modalEl) return;
    const form = document.getElementById('ledgerModalForm');
    const typeSel = document.getElementById('ledger_type');
    const actionEl = document.getElementById('ledger_action');
    const entryKindEl = document.getElementById('ledger_entry_kind');
    const amountInput = document.getElementById('ledger_amount_input');
    const amountPaidEl = document.getElementById('ledger_amount_paid');
    const amountEl = document.getElementById('ledger_amount');
    const methodWrap = modalEl.querySelector('.ledger-method-wrap');
    const submitBtn = document.getElementById('ledger_submit_btn');
    const preview = document.getElementById('ledger_balance_preview');
    const existingLabel = document.getElementById('ledger_existing_label');
    const remainingLabel = document.getElementById('ledger_remaining_label');
    const returnEl = document.getElementById('ledger_return_to');
    const customerLabel = document.getElementById('ledger_customer_label');
    const titleEl = document.getElementById('ledgerModalLabel');
    const currentBalance = () => (preview ? Number(preview.getAttribute('data-balance') || 0) : 0);
    const money = (n) => (window.ofMoney ? window.ofMoney(Math.abs(n)) : `PKR ${Math.abs(Number(n) || 0).toFixed(2)}`);
    const paintSide = (el, amount) => {
        if (!el) return;
        if (amount > 0.004) {
            el.textContent = `${money(amount)} receivable`;
            el.className = 'text-warning';
        } else if (amount < -0.004) {
            el.textContent = `${money(amount)} payable`;
            el.className = 'text-success';
        } else {
            el.textContent = 'Settled';
            el.className = '';
        }
    };

    const applyType = (type) => {
        if (type === 'payment') {
            actionEl.value = 'payment';
            entryKindEl.value = '';
            if (methodWrap) methodWrap.style.display = '';
            if (submitBtn) submitBtn.innerHTML = '<i class="bi bi-wallet2 me-1"></i> Settle Balance';
        } else if (type === 'advance') {
            actionEl.value = 'advance_loan';
            entryKindEl.value = 'advance';
            if (methodWrap) methodWrap.style.display = 'none';
            if (submitBtn) submitBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Save Advance';
        } else if (type === 'salary') {
            actionEl.value = 'advance_loan';
            entryKindEl.value = 'salary';
            if (methodWrap) methodWrap.style.display = 'none';
            if (submitBtn) submitBtn.innerHTML = '<i class="bi bi-cash-coin me-1"></i> Save Salary';
        } else {
            actionEl.value = 'advance_loan';
            entryKindEl.value = 'loan';
            if (methodWrap) methodWrap.style.display = 'none';
            if (submitBtn) submitBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Save Loan';
        }

        const val = amountInput ? amountInput.value : '';
        if (actionEl.value === 'payment') {
            amountPaidEl.value = val;
            amountEl.value = '';
        } else {
            amountEl.value = val;
            amountPaidEl.value = '';
        }

        const showPreview = type === 'payment' || type === 'salary';
        if (preview) preview.classList.toggle('d-none', !showPreview);
        if (showPreview) {
            const paid = Math.max(0, Number(val) || 0);
            const existing = currentBalance();
            paintSide(existingLabel, existing);
            paintSide(remainingLabel, existing - paid);
        }
    };

    if (typeSel) {
        typeSel.addEventListener('change', () => applyType(typeSel.value));
    }
    if (amountInput) {
        amountInput.addEventListener('input', () => applyType(typeSel ? typeSel.value : 'payment'));
    }

    modalEl.addEventListener('show.bs.modal', (event) => {
        const btn = event.relatedTarget;
        const mode = (btn && btn.getAttribute('data-ledger-mode')) || (typeSel ? typeSel.value : 'payment');
        if (btn) {
            const action = btn.getAttribute('data-pay-action');
            if (action && form) form.action = action;
            const bal = btn.getAttribute('data-balance');
            if (bal !== null && bal !== '' && preview) preview.setAttribute('data-balance', bal);
            if (returnEl) returnEl.value = btn.getAttribute('data-return-to') || '';
            const name = btn.getAttribute('data-customer-name') || '';
            if (customerLabel && name) {
                customerLabel.textContent = name;
                customerLabel.classList.remove('d-none');
            }
        }
        if (typeSel) typeSel.value = mode;
        if (titleEl) titleEl.textContent = 'Record Payment';
        if (amountInput) amountInput.value = '';
        const noteEl = document.getElementById('ledger_note');
        if (noteEl) noteEl.value = '';
        const methodSel = document.getElementById('ledger_method');
        if (methodSel) methodSel.value = 'Cash';
        const dateEl = document.getElementById('ledger_entry_date');
        if (dateEl && dateEl.defaultValue) dateEl.value = dateEl.defaultValue;
        applyType(mode);
    });

    applyType(typeSel ? typeSel.value : 'payment');
})();
</script>
