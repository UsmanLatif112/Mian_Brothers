{# Compact period filter for topbar-right — expects period, start_date, end_date, period_choices #}
<form method="GET" class="topbar-filters" id="period-filter-form" data-allow-multi-submit="1">
    {% if search is defined and search %}<input type="hidden" name="search" value="{{ search }}">{% endif %}
    {% if entry_type is defined and entry_type and entry_type != 'all' %}<input type="hidden" name="entry_type" value="{{ entry_type }}">{% endif %}
    {% if show_working_date %}
    <label class="topbar-working-date-label visually-hidden" for="topbar-working-date">Working date</label>
    <input type="date" id="topbar-working-date" name="working_date" class="form-control form-control-custom topbar-filter-date topbar-working-date"
           value="{{ working_date }}" aria-label="Working date" title="Working date — “Today” filters use this day">
    {% endif %}
    <select name="period" id="period-select" class="form-select form-control-custom topbar-filter-select" aria-label="Period">
        {% for value, label in period_choices %}
        <option value="{{ value }}" {% if period == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
    <div class="topbar-filter-dates custom-dates {% if period != 'custom' %}d-none{% endif %}">
        <input type="date" name="start_date" class="form-control form-control-custom topbar-filter-date" value="{{ start_date }}" aria-label="From date">
        <span class="topbar-date-sep">–</span>
        <input type="date" name="end_date" class="form-control form-control-custom topbar-filter-date" value="{{ end_date }}" aria-label="To date">
        <button type="submit" class="btn btn-primary-custom topbar-filter-apply" title="Apply"><i class="bi bi-check-lg"></i></button>
    </div>
</form>
<script>
(function () {
    const form = document.getElementById('period-filter-form');
    const sel = document.getElementById('period-select');
    if (!form || !sel) return;
    const customWrap = form.querySelector('.custom-dates');
    if (!customWrap) return;
    const dateInputs = customWrap.querySelectorAll('input[type="date"]');
    const startInput = dateInputs[0];
    const endInput = dateInputs[1];
    if (!startInput || !endInput) return;
    const setCustom = (on) => {
        customWrap.classList.toggle('d-none', !on);
        startInput.disabled = !on;
        endInput.disabled = !on;
        startInput.name = on ? 'start_date' : '';
        endInput.name = on ? 'end_date' : '';
    };
    setCustom(sel.value === 'custom');
    sel.addEventListener('change', () => {
        const isCustom = sel.value === 'custom';
        setCustom(isCustom);
        if (!isCustom) {
            const params = new URLSearchParams(new FormData(form));
            params.delete('start_date');
            params.delete('end_date');
            const qs = params.toString();
            const url = form.getAttribute('action') || window.location.pathname;
            if (window.ofNavigate) window.ofNavigate(url + (qs ? '?' + qs : ''), 'Loading…');
            else window.location.href = url + (qs ? '?' + qs : '');
        }
    });
    const wd = document.getElementById('topbar-working-date');
    if (wd) {
        wd.addEventListener('change', () => form.submit());
    }
})();
</script>
