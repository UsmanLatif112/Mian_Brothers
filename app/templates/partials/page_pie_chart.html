{# expects: chart_id, chart_title, chart_subtitle, chart_series, center_title #}
<section class="page-chart-strip">
    <div class="row g-3">
        <div class="col-12 col-lg-6 col-xl-5">
            <article class="chart-card chart-card--split">
                <div class="chart-split">
                    <div class="chart-split-data">
                        <div class="chart-card-head">
                            <h2 class="chart-card-title">{{ chart_title }}</h2>
                            {% if chart_subtitle %}<p class="chart-card-sub">{{ chart_subtitle }}</p>{% endif %}
                        </div>
                        <ul class="chart-legend" id="{{ chart_id }}-legend" aria-label="{{ chart_title }} breakdown"></ul>
                    </div>
                    <div class="chart-split-viz">
                        <div class="chart-canvas-wrap is-pie"><canvas id="{{ chart_id }}"></canvas></div>
                    </div>
                </div>
            </article>
        </div>
    </div>
</section>
<script type="application/json" id="{{ chart_id }}-json">{{ chart_series | tojson }}</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const boot = () => {
        if (!window.OctaneCharts || !window.Chart) return setTimeout(boot, 40);
        const data = OctaneCharts.parseJsonScript('{{ chart_id }}-json') || {};
        const canvas = document.getElementById('{{ chart_id }}');
        if (!canvas) return;
        const labels = data.labels || [];
        const values = data.values || [];
        const total = values.reduce((a, b) => a + Number(b || 0), 0);
        OctaneCharts.doughnutChart(canvas, {
            labels: labels.length ? labels : ['No data'],
            values: labels.length ? values : [1],
            legendContainer: document.getElementById('{{ chart_id }}-legend'),
            centerText: {
                title: '{{ center_title or "Total" }}',
                value: labels.length ? OctaneCharts.money(total) : '—',
            },
        });
    };
    boot();
});
</script>
