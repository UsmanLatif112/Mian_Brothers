{# Register Customer — reusable (customers page + sales quick-add) #}
<div class="modal fade of-quick-create-modal" id="createCustomerModal" tabindex="-1" aria-hidden="true"
     data-bs-focus="false" data-bs-backdrop="static" data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content customer-modal-content border-0 shadow" style="background-color: var(--card-bg); color: var(--text-primary); border-radius: 14px;">
            <form action="{{ url_for('customers.index') }}" method="POST" class="customer-modal-form"
                  data-of-ajax-create="customer"
                  data-create-url="{{ url_for('customers.api_create') }}"
                  data-no-loader="1">
                <input type="hidden" name="action" value="create">
                <div class="modal-header border-0 pb-2">
                    <h5 class="modal-title fw-bold">Register Customer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body customer-modal-body pt-2">
                    <div class="mb-3">
                        <label for="qc_create_name" class="form-label form-label-custom">Customer Name</label>
                        <input type="text" class="form-control form-control-custom" id="qc_create_name" name="name" required placeholder="Acme Logistics / Bob Smith">
                    </div>
                    <div class="mb-3">
                        <label for="qc_create_phone" class="form-label form-label-custom">Phone Number</label>
                        <input type="text" class="form-control form-control-custom" id="qc_create_phone" name="phone" placeholder="+1234567890">
                    </div>
                    <div class="mb-3">
                        <label for="qc_create_old_book_no" class="form-label form-label-custom">Old Book No <span class="text-muted-custom fw-normal">(Optional)</span></label>
                        <input type="text" class="form-control form-control-custom" id="qc_create_old_book_no" name="old_book_no" placeholder="Previous ledger / book number">
                    </div>
                    <div class="mb-3">
                        <label for="qc_create_previous_credit" class="form-label form-label-custom">Previous Balance <span class="text-muted-custom fw-normal">(Optional)</span></label>
                        <div class="input-group">
                            <span class="input-group-text">PKR</span>
                            <input type="number" step="0.01" class="form-control form-control-custom" id="qc_create_previous_credit" name="previous_credit" placeholder="e.g. 5000 or -2000">
                        </div>
                        <small class="text-muted-custom" style="font-size: 0.75rem;">
                            Positive = customer owes us. Negative (−) = advance — we owe the customer.
                        </small>
                    </div>
                    <div class="mb-3">
                        <label for="qc_create_entry_date" class="form-label form-label-custom">Entry Date</label>
                        <input type="date" class="form-control form-control-custom" id="qc_create_entry_date" name="entry_date" value="{{ today }}">
                    </div>
                    <div class="mb-3">
                        <label for="qc_create_address" class="form-label form-label-custom">Billing Address</label>
                        <input type="text" class="form-control form-control-custom" id="qc_create_address" name="address" placeholder="123 Main St, Springfield">
                    </div>
                    <div class="mb-1">
                        <label for="qc_create_limit" class="form-label form-label-custom">Credit Limit (PKR) (Optional)</label>
                        <input type="number" step="0.01" min="0" class="form-control form-control-custom" id="qc_create_limit" name="credit_limit" placeholder="5000">
                        <small class="text-muted-custom" style="font-size: 0.75rem;">Leave blank for unlimited credit.</small>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-2 pb-3 gap-2">
                    <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom px-4">Register Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>
