{# Shared A4 statement print chrome — recover / customer ledger / vendor ledger #}
<style>
.of-statement-sheet {
    display: none;
}
.of-statement-head {
    text-align: center;
    margin-bottom: 12px;
}
.of-statement-logo {
    display: block;
    width: 56px;
    height: 56px;
    object-fit: contain;
    margin: 0 auto 6px;
}
.of-statement-brand {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.3;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.of-statement-company-meta {
    margin: 0 0 2px;
    font-size: 11px;
    line-height: 1.4;
    color: #333;
    word-break: break-word;
}
.of-statement-title {
    margin: 10px 0 0;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}
.of-statement-party {
    font-size: 12px;
    margin-top: 6px;
    line-height: 1.4;
}
.of-statement-meta {
    font-size: 11px;
    margin-top: 4px;
    color: #333;
}
.of-statement-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 11px;
}
.of-statement-table th,
.of-statement-table td {
    border: 1px solid #000;
    padding: 5px 6px;
    vertical-align: top;
    word-break: break-word;
}
.of-statement-table th {
    font-weight: 700;
    text-align: left;
    background: #f3f3f3;
}
.of-statement-table .col-date { width: 14%; }
.of-statement-table .col-ref { width: 12%; }
.of-statement-table .col-desc { width: 34%; }
.of-statement-table .col-status { width: 10%; text-align: center; }
.of-statement-table .col-amt,
.of-statement-table .col-bal,
.of-statement-table .col-dr,
.of-statement-table .col-cr,
.of-statement-table .col-amount {
    width: 13%;
    text-align: right;
    white-space: nowrap;
}
.of-statement-table .col-check { width: 22px; text-align: center; }
.of-statement-table .col-name { width: 16%; }
.of-statement-table .col-address { width: 18%; }
.of-statement-table .col-phone { width: 11%; }
.of-statement-table .col-days { width: 9%; text-align: center; }
.of-statement-table .col-due { width: 11%; text-align: center; white-space: nowrap; }
.of-statement-table .col-notes { width: 18%; min-height: 22px; }
.of-statement-check {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 1.5px solid #000;
    vertical-align: middle;
}
.of-statement-table tfoot td {
    font-weight: 700;
}
.of-statement-foot {
    text-align: center;
    margin-top: 12px;
    font-size: 11px;
}

@media print {
    @page {
        size: A4;
        margin: 12mm;
    }

    html, body {
        width: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
    }

    body.of-print-statement * {
        visibility: hidden !important;
    }

    body.of-print-statement .of-statement-sheet,
    body.of-print-statement .of-statement-sheet * {
        visibility: visible !important;
    }

    body.of-print-statement .of-statement-sheet {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        font-family: Arial, Helvetica, sans-serif !important;
        font-size: 11px !important;
        line-height: 1.35 !important;
        color: #000 !important;
        background: #fff !important;
        z-index: 99999 !important;
    }

    body.of-print-statement .no-print {
        display: none !important;
    }
}
</style>
<script>
window.ofPrintStatement = function () {
    document.body.classList.add('of-print-statement');
    var cleanup = function () {
        document.body.classList.remove('of-print-statement');
        window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    window.print();
    setTimeout(cleanup, 1000);
};
</script>
